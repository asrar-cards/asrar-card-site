<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسرار الرقمية — صمم بطاقتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0C; --surface:#16161A; --surface-2:#1D1D22;
  --red:#EA2A33; --red-glow:#FF5158; --tech-blue:#3FD1E0;
  --gold:#C9A227; --gold-light:#E6CC74; --white:#F5F4F2; --muted:#8C8B92;
  --line:rgba(255,255,255,0.09); --line-red:rgba(234,42,51,0.4);
  --font-display:'Cairo', sans-serif; --font-body:'Tajawal', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--ink); color:var(--white); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
body{min-height:100vh; display:flex; justify-content:center; padding:28px 12px 60px;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea{font-family:inherit;}
img{max-width:100%; display:block;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

.phone{width:100%; max-width:412px; background:linear-gradient(180deg, var(--surface), var(--ink) 75%); border:1px solid var(--line); border-radius:26px; padding:20px 18px 26px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.7); position:relative; overflow:hidden;}

.brand{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px; position:relative; z-index:1;}
.brand .pulse{width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 9px var(--red); animation:pulseDot 1.6s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.25;}}
.brand h1{font-family:var(--font-display); font-weight:900; font-size:19px; color:var(--white); letter-spacing:.2px;}

.progress{display:flex; justify-content:center; gap:8px; margin:14px 0 22px; position:relative; z-index:1;}
.progress .dot{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.12); transition:background .3s, transform .3s;}
.progress .dot.active{background:var(--red); transform:scale(1.25); box-shadow:0 0 8px var(--red);}
.progress .dot.done{background:var(--red-glow);}

.step{position:relative; z-index:1; animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .step{animation:none;} *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.eyebrow{font-size:12px; color:var(--muted); letter-spacing:.3px; margin-bottom:6px;}
.title{font-family:var(--font-display); font-weight:800; font-size:23px; color:var(--white); line-height:1.4; margin-bottom:10px;}
.subtitle{font-size:14px; color:var(--muted); line-height:1.7; margin-bottom:22px;}

.scan-box{width:128px; height:160px; margin:6px auto 24px; position:relative; overflow:hidden; border:1.5px solid rgba(255,255,255,0.14); border-radius:14px; background:linear-gradient(160deg, var(--surface-2), var(--surface));}
.scan-box.lg{width:150px; height:190px;}
.scan-box::before{content:""; position:absolute; inset:13px; border:1px dashed rgba(255,255,255,0.12); border-radius:8px;}
.scan-box .scan-line{position:absolute; left:0; right:0; height:2px; top:10%; background:linear-gradient(90deg, transparent, var(--red), var(--tech-blue), transparent); box-shadow:0 0 14px var(--red); animation:scanMove 2.3s ease-in-out infinite;}
@keyframes scanMove{0%{top:8%;} 50%{top:86%;} 100%{top:8%;}}
.scan-box .ai-tag{position:absolute; top:8px; right:8px; background:var(--red); color:#fff; font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:6px; letter-spacing:.3px;}

.btn-primary{width:100%; padding:16px; border-radius:14px; background:linear-gradient(180deg, var(--red-glow), var(--red)); color:#fff; font-weight:700; font-size:15px; box-shadow:0 14px 26px -10px rgba(234,42,51,0.5); transition:transform .15s; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-primary svg{width:18px; height:18px;}
.btn-primary:hover{transform:translateY(-1px);}
.btn-primary:focus-visible{outline:2px solid var(--tech-blue); outline-offset:3px;}
.btn-primary:disabled{opacity:.6; cursor:default;}

.nav-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.back-btn{display:flex; align-items:center; gap:5px; font-size:13.5px; color:var(--muted);}
.back-btn svg{width:16px; height:16px; transform:scaleX(-1);}
.back-btn:focus-visible{outline:2px solid var(--tech-blue); outline-offset:3px; border-radius:6px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.occasion-card{border:1px solid var(--line); border-radius:14px; padding:16px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; background:var(--surface-2); transition:border-color .2s, transform .15s;}
.occasion-card svg{width:28px; height:28px; color:var(--white);}
.occasion-card span{font-size:13px; font-weight:500;}
.occasion-card:hover{border-color:var(--line-red); transform:translateY(-2px);}
.occasion-card:focus-visible{outline:2px solid var(--tech-blue); outline-offset:2px;}
.occasion-card.selected{border-color:var(--red); background:rgba(234,42,51,0.08);}
.occasion-card.selected svg{color:var(--red-glow);}

.size-option{display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:var(--surface-2); width:100%; text-align:right; transition:border-color .2s;}
.size-option.selected{border-color:var(--red);}
.size-option:focus-visible{outline:2px solid var(--tech-blue); outline-offset:2px;}
.size-swatch{flex:0 0 auto; width:34px; background:rgba(234,42,51,0.16); border:1px solid var(--red); border-radius:4px;}
.size-meta{flex:1;}
.size-meta .lbl{font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
.size-meta .note{font-size:12px; color:var(--muted); margin-top:2px;}
.badge-rec{font-size:10px; background:var(--red); color:#fff; padding:2px 7px; border-radius:20px; font-weight:700;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.field input, .field textarea{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--white); font-size:14px;}
.field input::placeholder, .field textarea::placeholder{color:#5C5B61;}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--red);}
.field textarea{resize:vertical; min-height:80px;}

.style-row{display:flex; gap:8px; margin-bottom:18px;}
.style-chip{flex:1; padding:10px 6px; border-radius:12px; border:1px solid var(--line); font-size:13px; text-align:center; background:var(--surface-2);}
.style-chip.selected{border-color:var(--red); background:rgba(234,42,51,0.1); color:var(--red-glow);}
.style-chip:focus-visible{outline:2px solid var(--tech-blue); outline-offset:2px;}

.upload-zone{border:1.5px dashed var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; margin-bottom:18px; position:relative;}
.upload-zone svg{width:24px; height:24px; color:var(--white);}
.upload-zone .hint{font-size:12px; color:var(--muted);}
.upload-zone input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.upload-preview{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:18px;}
.upload-preview img{width:46px; height:46px; border-radius:50%; object-fit:cover; border:1px solid var(--red);}
.upload-preview .name{flex:1; font-size:13px; color:var(--muted);}
.upload-preview button{font-size:12.5px; color:var(--red-glow); font-weight:700;}

.loading-wrap{display:flex; flex-direction:column; align-items:center; padding:24px 10px;}
.loading-text{margin-top:18px; font-size:13.5px; color:var(--muted); min-height:20px;}

.canvas-wrap{position:relative; margin-bottom:16px;}
.result-image{width:100%; border-radius:16px; display:block; border:1px solid var(--line-red);}
.error-box{border:1px solid var(--red); border-radius:14px; padding:18px; text-align:center; margin-bottom:16px;}
.error-box p{margin-bottom:14px; font-size:13.5px; color:var(--white); line-height:1.7;}
.card-canvas{width:100%; border-radius:16px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 22px 44px; text-align:center;}
.card-canvas.classic{background:linear-gradient(160deg, #2A2018, #3A2C1E 60%, #2A2018); border:2px solid var(--gold);}
.card-canvas.luxury{background:radial-gradient(circle at 50% 0%, #4A2326, #1C1011 75%); border:1px solid var(--gold-light);}
.card-canvas.modern{background:linear-gradient(135deg, var(--red), #6E1B22); border:none;}
.card-canvas .photo-frame{width:74px; height:74px; border-radius:50%; overflow:hidden; margin-bottom:14px; border:2px solid var(--gold-light); flex:0 0 auto;}
.card-canvas .photo-frame img{width:100%; height:100%; object-fit:cover;}
.card-canvas .c-title{font-family:var(--font-display); font-weight:800; font-size:23px; color:var(--gold-light); margin-bottom:8px; line-height:1.4;}
.card-canvas.modern .c-title{color:#fff;}
.card-canvas .c-line{font-size:13.5px; color:#F2E9DA; opacity:.9; margin-bottom:6px;}
.card-canvas .c-sub{font-size:12px; color:#C9BBA1;}
.card-canvas.modern .c-sub{color:rgba(255,255,255,0.75);}
.card-canvas .c-bracket{position:absolute; width:26px; height:26px; opacity:.6; color:var(--gold-light);}
.card-canvas.modern .c-bracket{color:rgba(255,255,255,.7);}
.card-canvas .c-bracket.tl{top:12px; right:12px;}
.card-canvas .c-bracket.br{bottom:12px; left:12px; transform:rotate(180deg);}
.card-canvas .brand-credit{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:10px; letter-spacing:.5px; color:rgba(230,204,116,0.65);}
.card-canvas.modern .brand-credit{color:rgba(255,255,255,0.6);}

.toast-host{position:absolute; inset:0; pointer-events:none; z-index:30;}
.toast{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.92); background:var(--surface-2); border:1px solid var(--line-red); border-radius:14px; padding:16px 20px; text-align:center; box-shadow:0 20px 40px -10px rgba(0,0,0,.6); opacity:0; transition:opacity .25s, transform .25s; width:78%;}
.toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
.toast .emoji{font-size:26px; margin-bottom:6px; display:block;}
.toast p{font-size:13px; color:var(--white); line-height:1.6;}

.social-row{margin:6px 0 18px; text-align:center;}
.social-row-label{font-size:12px; color:var(--muted); display:block; margin-bottom:10px;}
.social-icons{display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;}
.social-icon-link{width:42px; height:42px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; background:var(--surface-2); transition:border-color .2s;}
.social-icon-link svg{width:18px; height:18px; color:var(--red-glow);}
.social-icon-link:hover{border-color:var(--red);}
.social-icon-link:focus-visible{outline:2px solid var(--tech-blue); outline-offset:2px;}

.level-two{border:1px solid var(--line-red); border-radius:16px; padding:18px; background:linear-gradient(160deg, rgba(234,42,51,0.10), transparent); margin-bottom:8px;}
.level-two .tag{font-size:11px; color:var(--red-glow); font-weight:700; margin-bottom:8px; display:block;}
.level-two p{font-size:13.5px; line-height:1.8; color:var(--white); margin-bottom:14px;}
.level-two a.cta{display:block; text-align:center; padding:12px; border-radius:12px; background:var(--red); color:#fff; font-weight:700; font-size:14px;}
.level-two a.cta:focus-visible{outline:2px solid var(--tech-blue); outline-offset:3px;}

.restart-btn{display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;}

/* ---------- BIG OFFER MODAL ---------- */
.offer-overlay{position:fixed; inset:0; background:rgba(4,3,3,0.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:18px; overflow:hidden;}
.offer-overlay::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 28%, rgba(234,42,51,0.45), transparent 62%); animation:flashPulse 1.1s ease-out forwards;}
@keyframes flashPulse{0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;}}
.particle{position:absolute; bottom:0; border-radius:50%; background:var(--red-glow); box-shadow:0 0 10px var(--red-glow); opacity:0; animation:floatUp 3.2s ease-in infinite;}
@keyframes floatUp{0%{opacity:0; transform:translateY(0);} 12%{opacity:.9;} 100%{opacity:0; transform:translateY(-420px);}}

.offer-card{position:relative; width:100%; max-width:360px; max-height:88vh; overflow-y:auto; background:linear-gradient(165deg, var(--surface-2), var(--ink)); border:1.5px solid var(--red); border-radius:20px; padding:24px 20px 22px; box-shadow:0 0 0 1px rgba(234,42,51,0.25), 0 30px 70px -10px rgba(234,42,51,0.35); animation:offerPop .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes offerPop{0%{opacity:0; transform:scale(.65) translateY(30px);} 60%{opacity:1; transform:scale(1.045) translateY(-4px);} 100%{transform:scale(1) translateY(0);}}
.offer-close{position:absolute; top:12px; left:12px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; z-index:2;}
.offer-close:focus-visible{outline:2px solid var(--tech-blue);}

.reveal{opacity:0; transform:translateY(10px); animation:fadeUp .55s ease forwards;}
@keyframes fadeUp{to{opacity:1; transform:translateY(0);}}

.offer-kicker{display:inline-flex; align-items:center; gap:6px; background:var(--red); color:#fff; font-size:11px; font-weight:800; padding:4px 12px; border-radius:20px; margin-bottom:16px; animation-delay:.05s; box-shadow:0 0 16px rgba(234,42,51,0.6);}
.offer-loss{font-size:14px; color:var(--muted); text-decoration:line-through; margin-bottom:4px; animation-delay:.2s;}
.offer-headline{font-family:var(--font-display); font-weight:900; font-size:25px; line-height:1.35; color:var(--white); margin-bottom:16px; animation-delay:.35s;}
.offer-headline .num{color:var(--red-glow); font-size:27px;}
.offer-proof{border:1px solid var(--line-red); border-radius:14px; overflow:hidden; margin-bottom:8px; animation-delay:.5s; background:#0c0e0d;}
.offer-proof img{width:100%; height:auto; display:block; image-rendering:-webkit-optimize-contrast; image-rendering:crisp-edges;}
.offer-proof-cap{font-size:11px; color:var(--muted); text-align:center; padding:8px 6px; background:var(--surface-2); border-top:1px solid var(--line-red);}
.offer-body{font-size:13.5px; line-height:1.85; color:var(--white); margin:16px 0; animation-delay:.65s;}
.offer-body b{color:var(--gold-light); font-weight:700;}
.offer-price{border:1px dashed var(--line-red); border-radius:14px; padding:14px; text-align:center; margin-bottom:16px; animation-delay:.8s;}
.offer-price .small{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}
.offer-price .big{font-family:var(--font-display); font-weight:900; font-size:22px; color:var(--gold-light);}
.offer-price .urgent{font-size:12px; color:var(--red-glow); font-weight:700; margin-top:6px; display:block;}
.offer-cta{display:block; text-align:center; padding:15px; border-radius:13px; background:linear-gradient(180deg, var(--red-glow), var(--red)); color:#fff; font-weight:800; font-size:15.5px; box-shadow:0 16px 30px -10px rgba(234,42,51,0.6); animation-delay:.95s; animation:fadeUp .55s ease forwards, ctaPulse 1.8s ease-in-out 1.6s infinite;}
@keyframes ctaPulse{0%,100%{box-shadow:0 16px 30px -10px rgba(234,42,51,0.6);} 50%{box-shadow:0 16px 38px -6px rgba(234,42,51,0.95);}}
.offer-skip{display:block; text-align:center; margin-top:12px; font-size:12.5px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; animation-delay:1.05s;}
</style>
</head>
<body>

<div class="phone">
  <div class="brand"><span class="pulse"></span><h1>أسرار الرقمية</h1></div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="app"></main>
  <div class="toast-host" id="toastHost"></div>
</div>

<script>
const OCCASIONS = [
  { id:'wedding', label:'زواج', icon:'icon-ring',

let state = { step:0, occasion:null, size:'direct', style:'classic', fields:{}, photo:null, offerShown:false, generatedImage:null, generationError:null, loadingInterval:null };

function setField(id,val){ state.fields[id]=val; }
function onPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 900;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.photo = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function generate(){
  setStep(4);
  const occ = OCCASIONS.find(o=>o.id===state.occasion);
  const look = pick(occ.looks);
  const isWeddingNoPhoto = occ.id === 'wedding' && !state.photo;
  const prompt = isWeddingNoPhoto ? buildWeddingFullPrompt(state.fields) : (state.photo ? buildPhotoPrompt(occ, state.fields, look) : buildPrompt(occ, state.fields, look));
  try{
    const res = await fetch('/.netlify/functions/generate-card', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt, size: state.size, photo: state.photo })
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'فشل التوليد');
    if(isWeddingNoPhoto){
      state.generatedImage = data.image;
    } else {
      const extra = occ.extra ? occ.extra(state.fields) : [];
      const lines = [occ.title(state.fields), occ.line(state.fields), occ.sub(state.fields), ...extra].filter(Boolean);
      const textColor = getTextColor(occ, look);
      const fontFamily = occ.id === 'wedding' ? 'Amiri' : null;
      let anchorRatio = 0.58;
      if(state.photo && occ.id === 'birthday' && state.fields.age) anchorRatio = 0.88;
      else if(occ.id === 'wedding') anchorRatio = 0.84;
      state.generatedImage = await compositeText(data.image, lines, textColor, anchorRatio, fontFamily);
    }
    state.generationError = null;
  } catch(err){
    state.generationError = err.message || 'تعذّر التوليد، تحقق من الاتصال وحاول مرة ثانية';
    state.generatedImage = null;
  } finally {
    clearInterval(state.loadingInterval);
    setStep(5);
  }
}
async function compositeText(imageSrc, lines, textColor, anchorRatio, fontFamily){
  const ff = fontFamily || 'Cairo';
  const ff2 = fontFamily || 'Tajawal';
  try{ await document.fonts.load(`700 60px ${ff}`); await document.fonts.load(`400 30px ${ff2}`); await document.fonts.ready; }catch(e){}
  const img = await new Promise((resolve,reject)=>{ const im = new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src = imageSrc; });
  const W = img.naturalWidth || 1024, H = img.naturalHeight || 1536;
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  const col = (textColor || '#7A2E3A').replace('#','');
  const r = parseInt(col.substr(0,2),16), g = parseInt(col.substr(2,2),16), b = parseInt(col.substr(4,2),16);
  const isLight = (r*299+g*587+b*114)/1000 > 150;
  const scrim = isLight ? '0,0,0' : '255,255,255';
  const zoneTop = Math.max(0, H*((anchorRatio||0.58) - 0.32));
  const grad = ctx.createLinearGradient(0, zoneTop, 0, H);
  grad.addColorStop(0, `rgba(${scrim},0)`);
  grad.addColorStop(0.35, `rgba(${scrim},0.55)`);
  grad.addColorStop(1, `rgba(${scrim},0.85)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, zoneTop, W, H - zoneTop);
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = textColor || '#7A2E3A';
  ctx.shadowColor = isLight ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.4)'; ctx.shadowBlur = W*0.012;
  const cx = W/2;
  const maxWidth = W*0.78;
  function wrap(text, font){
    ctx.font = font;
    const words = text.split(' ');
    const out = []; let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && cur){ out.push(cur); cur = w; } else cur = test;
    }
    if(cur) out.push(cur);
    return out;
  }
  const titleFont = `700 ${Math.round(W*0.072)}px ${ff}, sans-serif`;
  const lineFont = `400 ${Math.round(W*0.038)}px ${ff2}, sans-serif`;
  const subFont = `400 ${Math.round(W*0.032)}px ${ff2}, sans-serif`;
  const fonts = [titleFont, lineFont, subFont];
  const blocks = lines.map((t,i)=>({lines:wrap(t, fonts[i]||subFont), font:fonts[i]||subFont, gap:i===0?Math.round(W*0.09):Math.round(W*0.05)}));
  let totalH = 0;
  blocks.forEach(b=>{ totalH += b.lines.length * (parseInt(b.font.match(/(\d+)px/)[1])*1.35) + b.gap; });
  let y = H*(anchorRatio||0.58) - totalH/2;
  blocks.forEach(b=>{
    ctx.font = b.font;
    const lh = parseInt(b.font.match(/(\d+)px/)[1])*1.35;
    b.lines.forEach(ln=>{ y += lh; ctx.fillText(ln, cx, y); });
    y += b.gap;
  });
  return canvas.toDataURL('image/png');
}

    {key:'tiktok', icon:'icon-tiktok'},{key:'instagram', icon:'icon-instagram'},
    {key:'telegram', icon:'icon-telegram'},{key:'youtube', icon:'icon-youtube'}
  ].map(s => `<a class="social-icon-link" href="${LINKS[s.key]}" target="_blank" rel="noopener" aria-label="${s.key}"><svg><use href="#${s.icon}"/></svg></a>`).join('');
}

function downloadCard(){
  const link = document.createElement('a');
  link.download = 'بطاقة-اسرار-الرقمية.png';
  link.href = state.generatedImage;
  document.body.appendChild(link); link.click(); link.remove();
  showToast();
  if(!state.offerShown){
    state.offerShown = true;
    setTimeout(openOfferModal, 1500);
  }
}
function showToast(msg){
  const host = document.getElementById('toastHost');
  host.innerHTML = `<div class="toast" id="toastBox"><span class="emoji">${msg?'⚠️':'🎉'}</span><p>${msg||'تم تحميل تصميمك بنجاح'}</p></div>`;
  requestAnimationFrame(()=> document.getElementById('toastBox').classList.add('show'));
  setTimeout(()=>{ const t=document.getElementById('toastBox'); if(t){ t.classList.remove('show'); setTimeout(()=>t.remove(),300); } }, 2600);
}

function buildParticles(n){
  let h='';
  for(let i=0;i<n;i++){
    const left = 5 + Math.random()*90;
    const size = 4 + Math.random()*5;
    const delay = (Math.random()*3).toFixed(2);
    const dur = (2.6 + Math.random()*1.4).toFixed(2);
    h += `<span class="particle" style="left:${left}%; width:${size}px; height:${size}px; animation-delay:${delay}s; animation-duration:${dur}s;"></span>`;
  }
  return h;
}
function animateCounter(el, to, duration){
  const start = performance.now();
  function tick(now){
    const progress = Math.min((now-start)/duration, 1);
    const eased = 1 - Math.pow(1-progress, 3);
    el.textContent = Math.floor(eased*to).toLocaleString('en-US');
    if(progress<1) requestAnimationFrame(tick);
    else el.textContent = to.toLocaleString('en-US');
  }
  requestAnimationFrame(tick);
}
function openOfferModal(){
  if(document.getElementById('offerModal')) return;
  const div = document.createElement('div');
  div.className = 'offer-overlay';
  div.id = 'offerModal';
  div.innerHTML = `
    ${buildParticles(10)}
    <div class="offer-card">
      <button class="offer-close" onclick="closeOfferModal()">✕</button>
      <span class="offer-kicker reveal">🔥 فرصة نادرة</span>
      <div class="offer-loss reveal">من 45 ريالاً ضائعة..</div>
      <div class="offer-headline reveal">إلى <span class="num" id="offerCounter">0</span> ريال مبيعات حقيقية</div>
      <div class="offer-proof reveal">
        <img src="${PROOF_IMAGE}" alt="إثبات مبيعات حقيقي">
        <div class="offer-proof-cap">📊 إثباتات المبيعات الحقيقية — مبيعات شهر واحد</div>
      </div>
      <div class="offer-body reveal">لا نبيعك <b>أحلامًا</b>، نبيعك <b>"السيستم"</b> الذي حقق هذه الأرقام أمام عينك. تعلم تجارة المنتجات الرقمية والأتمتة من الصفر حتى الاحتراف.</div>
      <div class="offer-price reveal">
        <span class="small">فرصة نادرة — احصل على الدورة الآن بـ</span>
        <span class="big">49 ريال فقط</span>
        <span class="urgent">⏳ اليوم فقط — فرصة لن تتكرر</span>
      </div>
      <a class="offer-cta reveal" href="${LINKS.course}" target="_blank" rel="noopener" onclick="closeOfferModal()">سجل الآن</a>
      <button class="offer-skip reveal" onclick="closeOfferModal()">لا شكرًا، أكمل بدونها</button>
    </div>`;
  document.body.appendChild(div);
  animateCounter(document.getElementById('offerCounter'), 300000, 1500);
}
function closeOfferModal(){ const el = document.getElementById('offerModal'); if(el) el.remove(); }

function resetAll(){ state = { step:0, occasion:null, size:'direct', style:'classic', fields:{}, photo:null, offerShown:state.offerShown, generatedImage:null, generationError:null, loadingInterval:null }; render(); }
render();
</script>
</body>
